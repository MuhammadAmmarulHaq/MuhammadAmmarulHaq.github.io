<footer class="wrap site-foot">
  <p class="foot-line">
    <span class="foot-key">generated by</span> jekyll
    <span class="foot-sep">|</span>
    <span class="foot-key">hosted on</span> <a href="https://pages.github.com/">github pages</a>
    <span class="foot-sep">|</span>
    <a href="{{ '/feed.xml' | relative_url }}">rss.xml</a>
    <span class="foot-sep">|</span>
    <a href="https://github.com/{{ site.github_username }}">github</a>
  </p>
  <p class="foot-end">{{ site.prompt.user }}@{{ site.prompt.host }}:~$ exit<span class="foot-code">0</span></p>
</footer>
<script src="{{ '/assets/js/copy.js' | relative_url }}" defer></script>
